[package]
name = "workbench"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Persistent per-person workspaces: long-lived cloud-hypervisor VMs on NixOS"
license = "MIT"
repository = "https://github.com/OSSystems/workbench-nix"
publish = false

[workspace]
members = ["model", "web"]
# vmkit is the flake's input, linked here by the dev shell and the build;
# workbench-connect is a crate of its own, for people's computers.
exclude = ["vmkit", "connect"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
similar_names = "allow"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.8", features = ["derive"] }
jiff = { version = "1.0.1", features = ["serde"] }
nix = { version = "0.32.0", features = ["fs", "term", "user"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio = { version = "1.54.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.7"
vmkit = { path = "vmkit" }
workbench-model = { path = "model" }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true

# The web UI's WebAssembly, small rather than fast.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
