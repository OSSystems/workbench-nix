[package]
name = "workbench"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Persistent per-person workspaces: long-lived cloud-hypervisor VMs on NixOS"
license = "MIT"
repository = "https://github.com/OSSystems/workbench-nix"
publish = false

[workspace]
members = ["model", "web"]
# vmkit is the flake's input, linked here by the dev shell and the build;
# workbench-connect is a crate of its own, for people's computers.
exclude = ["vmkit", "connect"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
similar_names = "allow"

[dependencies]
anyhow = "1.0.104"
# The front's and the nodes' APIs and their client: the versions the web
# crate locks.
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
clap = { version = "4.6.8", features = ["derive"] }
futures-util = { version = "0.3.31", features = ["sink"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
jiff = { version = "1.0.1", features = ["serde"] }
nix = { version = "0.32.0", features = ["fs", "term", "user"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio = { version = "1.54.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
url = "2.5.7"
vmkit = { path = "vmkit" }
workbench-model = { path = "model" }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.2", features = ["util"] }

[lints]
workspace = true

# The web UI's WebAssembly, small rather than fast.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
